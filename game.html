<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="gameStyle.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Fruit rush</title>
</head>

<body>
    <div class="row p-4">
        <div class="col-md-3 border rounded shadow-sm">
            <div class="p-3">
                <h1 class="mt-3 fw-bold">Fruit Rush</h1>
                <p class="fst-italic">
                    Help Orazio collect all the fruit he needs to bake the perfect fruit cake for all his friends!!
                </p>

                <div class="card mt-3 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Player</h5>
                        <p class="card-text">Lifes <span id="lifes" class="fw-bold text-danger">3</span></p>
                        <p class="card-text">Points <span id="points" class="fw-bold text-success">0</span></p>
                        <p class="card-text">Fruit catched <span id="fruitCatched" class="fw-bold text-warning">0</span>
                        </p>
                    </div>
                </div>

                <div class="card mt-3 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Commands</h5>
                        <p class="card-text mb-1"><strong>A</strong> -> move to the left</p>
                        <p class="card-text"><strong>D</strong> -> move to the right</p>
                    </div>
                </div>

                <div class="card mt-3 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Appereance</h5>
                        <div class="input-group mb-3">
                            <label class="input-group-text" for="inputGroupSelect01">Options</label>
                            <select class="form-select" id="inputGroupSelect01">
                                <option selected>Green</option>
                                <option value="1">Blue</option>
                                <option value="2">Red</option>
                                <option value="3">Yellow</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-9 d-flex justify-content-center align-items-center">
            <div class="gameSection position-relative d-flex justify-content-center align-items-center w-100">

                <canvas id="gameCanvas" width="1000" height="500"
                    class="d-block mx-auto border border-4 border-dark rounded-3 shadow-lg mw-100 bg-white"
                    style="z-index: 0;">
                </canvas>

                <div id="gameOverOverlay"
                    class="d-none position-absolute top-50 start-50 translate-middle bg-dark bg-opacity-75 text-white p-5 rounded-4 shadow text-center z-1"
                    style="min-width: 300px; backdrop-filter: blur(4px);">
                    <h1 class="fw-bold text-danger">Oh no!</h1>
                    <p class="fst-italic fs-5">Orazio died :C</p>
                    <p class="fs-4">Final points: <span id="finalPoints" class="fw-bold"></span></p>
                    <button id="btnRestart" class="btn btn-light btn-lg fw-bold mt-3 px-4 rounded-pill">
                        Retry
                    </button>
                </div>

            </div>
        </div>
    </div>

    <footer></footer>
    <script type="module" src="./page/gameScript.js"></script>
</body>

</html>
